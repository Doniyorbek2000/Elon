# Local development stack.
#
#   docker compose up -d postgres redis storage      # dependencies only (run API on host)
#   docker compose --profile app up -d --build       # + API and worker containers
#
# Object storage: SeaweedFS exposes an S3-compatible API on :8333. Any
# S3-compatible service (MinIO, AWS S3, Cloudflare R2) works by changing S3_*.
name: bozor

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: bozor
      POSTGRES_PASSWORD: bozor_dev_password
      POSTGRES_DB: bozor
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bozor -d bozor"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=0"]
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./backend/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  api:
    profiles: [app]
    image: bozor/api:local
    build: ./backend
    init: true
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed.js && node dist/src/main.js"]
    env_file: ./backend/.env.docker
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_started }

  worker:
    profiles: [app]
    image: bozor/api:local
    build: ./backend
    init: true
    command: ["node", "dist/src/worker.js"]
    healthcheck:
      disable: true
    env_file: ./backend/.env.docker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  s3data:
