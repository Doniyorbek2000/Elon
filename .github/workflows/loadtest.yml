name: Load test

# Manual: boots the stack, seeds 20 000 listings and runs the read-path and chat load tests with thresholds.
on:
  workflow_dispatch:
    inputs:
      listings:
        description: Synthetic listings
        default: "20000"
      connections:
        description: HTTP connections
        default: "100"

defaults:
  run:
    working-directory: backend

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: bozor
          POSTGRES_PASSWORD: bozor_dev_password
          POSTGRES_DB: bozor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bozor -d bozor" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://bozor:bozor_dev_password@localhost:5432/bozor?schema=public
      REDIS_URL: redis://localhost:6379/0
      JWT_ACCESS_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      OTP_HASH_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      OTP_PROVIDER: dev
      OTP_DEV_ECHO: "true"
      RATE_LIMIT_PER_MINUTE: "1000000"
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: bozor-load
      S3_ACCESS_KEY_ID: x
      S3_SECRET_ACCESS_KEY: y
      LOG_LEVEL: warn
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate && npm run build
      - run: npx prisma migrate deploy && npm run db:seed
      - run: npm run loadtest:seed -- ${{ inputs.listings }}
      - name: Start API
        run: |
          node dist/src/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/v1/config > /dev/null && break; sleep 1; done
      - run: npm run loadtest:http -- 15 ${{ inputs.connections }}
      - run: npm run loadtest:chat -- 50 20
      - if: failure()
        run: tail -n 100 /tmp/api.log
